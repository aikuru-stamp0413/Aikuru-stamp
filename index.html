<script type="module">
  // Firebaseの読み込み
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
  } from
    "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  // Firebase設定
  const firebaseConfig = {
    apiKey: "AIzaSyCm2JzJrmu3SKUw4p9bHWAVHpeo7Cmf6IQ",
    authDomain: "aikuru-stamp.firebaseapp.com",
    projectId: "aikuru-stamp",
    storageBucket: "aikuru-stamp.firebasestorage.app",
    messagingSenderId: "618961381186",
    appId: "1:618961381186:web:da20f4db71f165f7be8adb",
    measurementId: "G-MW4LM9P5TB"
  };

  // Firebase初期化
  const app = initializeApp(firebaseConfig);

  // Authentication初期化
  const auth = getAuth(app);

  // Googleログイン設定
  const googleProvider = new GoogleAuthProvider();

  // ログインボタン
  document.getElementById("googleLoginBtn")
    .addEventListener("click", async () => {

      const notice = document.getElementById("notice");

      try {
        notice.textContent = "ログイン中だよ...🪽";

        const result = await signInWithPopup(
          auth,
          googleProvider
        );

        const user = result.user;

        alert("ログインできたよ！🪽");

        notice.textContent =
          user.displayName + " でログイン中♡";

        console.log("ログイン成功！");
        console.log(user);

      } catch (error) {

        console.error("ログインエラー:", error);

        notice.textContent =
          "ログインできなかったよ…";

        alert(
          "エラーコード: " + error.code +
          "\n" + error.message
        );
      }
    });
</script>
